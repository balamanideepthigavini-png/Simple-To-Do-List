kind = "mobile"
previewPath = "/todo-list/"
title = "To-Do List"
description = "A simple native mobile to-do app for capturing everyday tasks, checking them off, and removing finished items, with tasks saved on the device."
version = "1.0.0"
id = "artifacts/todo-list"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/todo-list/" ]
localPort = 24804

[services.development]
run = "pnpm --filter @workspace/todo-list run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/todo-list", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/todo-list", "run", "serve" ]

[services.env]
PORT = "24804"
BASE_PATH = "/todo-list/"
